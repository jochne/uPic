name: Build uPic
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode with Swift 6.3.2 (matches libminipng)
        run: |
          for x in /Applications/Xcode*.app; do
            sv=$(DEVELOPER_DIR="$x" xcrun swift --version 2>/dev/null | head -1)
            echo "$x => $sv"
            if echo "$sv" | grep -q "6.3.2"; then
              echo "匹配: $x"
              sudo xcode-select -s "$x"
              xcodebuild -version
              echo "SELECTED=1" >> "$GITHUB_ENV"
            fi
          done
          if [ "${SELECTED:-0}" != "1" ]; then
            echo "::warning::未找到 Swift 6.3.2 的 Xcode，将用默认版本继续尝试"
          fi

      - name: Resolve package dependencies
        run: |
          xcodebuild -resolvePackageDependencies -project uPic.xcodeproj -scheme "uPic(Release)" || true

      - name: Build
        run: |
          set -o pipefail
          xcodebuild -project uPic.xcodeproj \
            -scheme "uPic(Release)" \
            -configuration Release \
            -destination 'generic/platform=macOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tail -80

      - name: Package
        run: |
          cd build/Build/Products/Release
          zip -qry "$GITHUB_WORKSPACE/uPic-1.4.9-unsigned.zip" uPic.app
          ls -lh "$GITHUB_WORKSPACE/uPic-1.4.9-unsigned.zip"

      - uses: actions/upload-artifact@v4
        with:
          name: uPic-1.4.9-unsigned
          path: uPic-1.4.9-unsigned.zip
          retention-days: 7
